<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Web</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <div class="contenedor">
    <h1>FACTURA WEB</h1>
    <form action="" method="get">
        <input type="number" name="ide" id="ide" placeholder="Ingrese su identificación" > <br><br>
        <input type="text" name="nom" id="nom" placeholder="Ingrese sus nombres y apellidos"> <br><br>
        <input type="text" name="dir" id="dir" placeholder="Ingrese su dirección"> <br><br>
        <input type="number" name="tel" id="tel" placeholder="Ingrese su número de teléfono"> <br><br>
        <input type="number" name="nfac" id="nfac" placeholder="Ingrese el número de factura"> <br><br>
        <input type="text" name="fecha" id="fecha" placeholder="Ingrese la fecha"> <br><br>
        <input type="text" name="rs" id="rs" placeholder="Ingrese la razón social"> <br><br>
        <input type="text" name="p" id="p" placeholder="Ingrese el producto"> <br><br>
        <input type="number" name="cant" id="cant" placeholder="Ingrese la cantidad"> <br><br>
        <input type="number" name="vu" id="vu" placeholder="Ingrese el valor unitario"> <br><br>
       <input type="button" class="boton-factura" value="Mostrar Factura" onclick="buscar()">
        <script src="js/main.js"></script> 
    </form>
    </div>
</body>
</html>
